[project]
name = "wikiwiki"
version = "0.1.0"
description = "Local Calibre book discovery with semantic retrieval"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.24",
    "sentence-transformers>=3.0",
    "rich>=14.0",
    "textual>=0.50",
]

[project.scripts]
wikiwiki = "wikiwiki.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/wikiwiki.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["src"]
